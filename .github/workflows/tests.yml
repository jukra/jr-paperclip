name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.0'
            gemfile: gemfiles/7.0.gemfile
          - ruby: '3.1'
            gemfile: gemfiles/7.1.gemfile
          - ruby: '3.2'
            gemfile: gemfiles/7.2.gemfile
          - ruby: '3.3'
            gemfile: gemfiles/8.0.gemfile
          - ruby: '3.4'
            gemfile: gemfiles/7.2.gemfile
          - ruby: '3.4'
            gemfile: gemfiles/8.0.gemfile
          - ruby: '3.4'
            gemfile: gemfiles/8.1.gemfile
          - ruby: '4.0'
            gemfile: gemfiles/8.1.gemfile

    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript imagemagick libvips libvips-tools
          sudo rm -f /etc/ImageMagick-6/policy.xml

      - name: Run tests
        run: bundle exec rake spec

      - name: Run cucumber
        run: bundle exec rake cucumber
